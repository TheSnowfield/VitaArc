image: vitasdk/vitasdk:latest

stages:
  - test
  - build
  - release

workflow:
  rules:
    - if: $CI_COMMIT_TAG
      when: never
    - if: $CI_PIPELINE_SOURCE == "merge_request_event"
    - if: $CI_COMMIT_BRANCH

test-jni:
  image: ubuntu:24.04
  stage: test
  before_script:
    - apt-get update
    - apt-get install -y --no-install-recommends build-essential cmake git python3 python3-pil libffi-dev libvorbis-dev libfreetype-dev libpng-dev fonts-dejavu-core
  script:
    - python3 -m unittest discover -s tests -p 'test_package*.py'
    - python3 -m unittest discover -s tests -p 'test_release_tools.py'
    - cmake -S tests -B build/host-tests -DCMAKE_BUILD_TYPE=Debug -DPython3_EXECUTABLE=/usr/bin/python3
    - cmake --build build/host-tests --parallel 2
    - ctest --test-dir build/host-tests --output-on-failure

build-vpk:
  stage: build
  script:
    - bash build.sh
    - python3 tools/check_vpk.py build/VitaArc.vpk
  artifacts:
    name: "VitaArc-${CI_COMMIT_SHORT_SHA}"
    paths:
      - build/VitaArc.vpk
    expire_in: 14 days

nightly:
  image: python:3.12-alpine
  stage: release
  needs:
    - job: test-jni
      artifacts: false
    - job: build-vpk
      artifacts: true
  rules:
    - if: $CI_COMMIT_BRANCH && ($CI_PIPELINE_SOURCE == "push" || $CI_PIPELINE_SOURCE == "web")
  resource_group: nightly-${CI_COMMIT_SHA}
  variables:
    GIT_DEPTH: "0"
  before_script:
    - apk add --no-cache git
  script:
    - python3 tools/check_vpk.py build/VitaArc.vpk
    - python3 tools/nightly_notes.py --commit "$CI_COMMIT_SHA" --provider gitlab --repository-url "$CI_PROJECT_URL" --output build/nightly-notes.md
    - python3 tools/publish_nightly.py --vpk build/VitaArc.vpk --notes build/nightly-notes.md
